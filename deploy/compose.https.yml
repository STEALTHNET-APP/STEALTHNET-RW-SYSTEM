services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    network_mode: host
    environment:
      SN_SITE: ${SN_SITE:?}
      SN_SITE_WWW: ${SN_SITE_WWW:-}
      SN_SITE_ALIASES: ${SN_SITE_ALIASES:-}
      SN_HTTP_PORT: ${SN_HTTP_PORT:-8080}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  caddy-data:
  caddy-config:
